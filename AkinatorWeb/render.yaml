services:
  - type: web
    name: akinatorweb
    runtime: node
    region: frankfurt
    # Plan 'free' : PAS de disque persistant possible, et mise en veille après
    # inactivité. Conséquence assumée pour cette démo : le système de fichiers
    # est éphémère, donc la base SQLite et les avatars uploadés sont PERDUS à
    # chaque redéploiement et à chaque réveil après veille.
    # Le compte admin est recréé au démarrage (ADMIN_USERNAME/ADMIN_PASSWORD),
    # mais les comptes utilisateurs, parties et jetons ne survivent pas.
    # Passer à 'starter' + un bloc `disk:` monté sur /var/data (avec
    # DATA_DIR=/var/data) si les données doivent être conservées.
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: Akinator
      - key: ADMIN_PASSWORD
        sync: false        # À renseigner manuellement dans Render (votre mot de passe admin)
      # Pas de DATA_DIR : sans disque monté, le code retombe sur backend/data,
      # créé automatiquement au démarrage (et perdu au redéploiement).
      # Secrets REQUIS en production : sans eux le serveur refuse de démarrer
      # (fail-secure, services/encryption.js et services/auditService.js).
      # Format imposé : 64 caractères hexadécimaux — donc PAS generateValue,
      # qui ne respecte pas ce format. Générer avec :
      #   cd backend && node scripts/generate-keys.js
      # puis coller les valeurs dans le dashboard Render.
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: APP_URL
        value: https://akinatorweb.onrender.com  # Modifier avec votre URL Render
      # Variables optionnelles - décommenter si vous avez les credentials
      # - key: TWITCH_CLIENT_ID
      #   sync: false
      # - key: TWITCH_CLIENT_SECRET
      #   sync: false
